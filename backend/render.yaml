services:
  - type: web
    name: document-verify-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ALLOWED_ORIGINS
        value: https://docu-verify.onrender.com,https://doce-xtended.vercel.app,https://docu-verify-eight.vercel.app,http://localhost:3005,http://localhost:3000
    autoDeploy: true
